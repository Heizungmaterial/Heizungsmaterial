
<!DOCTYPE html>
<html>
<head><title>Weizungmaterial.ch – Matrix Webshop</title></head>
<body>
<h1>🧠 Matrix Webshop – Weizungmaterial.ch</h1>
{% for p in produkty %}
<div style="border:1px solid #ccc;padding:10px;margin:10px;">
  <h2>{{ p.nazwa }}</h2>
  <p>Cena: {{ p.cena }} CHF</p>
  <p>Status: {{ p.status }}</p>
  <p>{{ p.opis }}</p>
  <a href="/produkt/{{ p.id }}">➡️ Zobacz szczegóły</a>
</div>
{% endfor %}
</body>
</html>
