<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Heizungsmaterial Shop</title>
</head>
<body>
    <h1>🛠️ Heizungsmaterial – Produkty</h1>

    {% if produkty %}
        <ul>
        {% for produkt in produkty %}
            <li>
                <a href="/produkt/{{ produkt.id }}">
                    {{ produkt.nazwa }} – {{ produkt.cena }} CHF
                </a>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Brak produktów do wyświetlenia.</p>
    {% endif %}
</body>
</html>
