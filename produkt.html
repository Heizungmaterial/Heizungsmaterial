
<!DOCTYPE html>
<html>
<head><title>{{ produkt.nazwa }}</title></head>
<body>
<h1>{{ produkt.nazwa }}</h1>
<p>Cena: {{ produkt.cena }} CHF</p>
<p>Status: {{ produkt.status }}</p>
<p>{{ produkt.opis }}</p>

<h2>📩 Zapytaj o produkt</h2>
<form method="POST" action="/kontakt/{{ produkt.id }}">
  <p>Imię:<br><input type="text" name="imie" required></p>
  <p>Email:<br><input type="email" name="email" required></p>
  <p>Wiadomość:<br><textarea name="wiadomosc" rows="5" required></textarea></p>
  <p><button type="submit">Wyślij</button></p>
</form>
<p><a href="/">⬅️ Powrót</a></p>
</body>
</html>
