<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{{ produkt.nazwa }}</title>
</head>
<body>
    <h1>{{ produkt.nazwa }}</h1>
    <p><strong>Preis:</strong> {{ produkt.cena }} CHF inkl. MwSt.</p>
    <p><strong>Status:</strong> {{ produkt.status }}</p>
    <p>{{ produkt.opis }}</p>

    <form method="POST" action="/kontakt/{{ produkt.id }}">
        <h3>Kontaktformular</h3>
        <input type="text" name="imie" placeholder="Ihr Name" required><br>
        <input type="email" name="email" placeholder="Ihre E-Mail" required><br>
        <textarea name="wiadomosc" placeholder="Ihre Nachricht" required></textarea><br>
        <button type="submit">Anfrage senden</button>
    </form>

    <p><a href="/">🔙 Zurück zum Shop</a></p>
</body>
</html>
